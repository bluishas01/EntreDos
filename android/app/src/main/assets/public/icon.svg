<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bg-red" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.34" />
      <stop offset="65%" stop-color="#991B1B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bg-blue" cx="35%" cy="48%" r="36%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bg-pink" cx="68%" cy="48%" r="36%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="male-grad" x1="115" y1="150" x2="275" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="female-grad" x1="235" y1="145" x2="395" y2="335" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F9A8D4" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#9D174D" />
    </linearGradient>
    <radialGradient id="spark-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCA5A5" />
      <stop offset="55%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#09090B" />
  <circle cx="256" cy="256" r="220" fill="url(#bg-red)" />
  <circle cx="185" cy="252" r="150" fill="url(#bg-blue)" />
  <circle cx="330" cy="252" r="150" fill="url(#bg-pink)" />

  <!-- Símbolo Él (♂ Azul) -->
  <circle cx="200" cy="260" r="82" stroke="url(#male-grad)" stroke-width="20" />
  <path
    d="M258 202L314 146M314 146H274M314 146V186"
    stroke="url(#male-grad)"
    stroke-width="19"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Símbolo Ella (♀ Rosa) -->
  <circle cx="312" cy="248" r="82" stroke="url(#female-grad)" stroke-width="20" />
  <path
    d="M312 330V402M280 370H344"
    stroke="url(#female-grad)"
    stroke-width="19"
    stroke-linecap="round"
  />

  <!-- Destello rojo en el punto de encuentro -->
  <circle cx="256" cy="254" r="16" fill="url(#spark-grad)" />
  <circle cx="256" cy="254" r="26" stroke="#EF4444" stroke-opacity="0.45" stroke-width="4" />
</svg>
